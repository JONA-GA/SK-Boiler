; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = shesp32

[env]
upload_speed = 115200
monitor_speed = 115200
lib_deps = SignalK/SensESP @ >=3.0.0-beta.6,<4.0.0-alpha.1
build_flags = 
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
	-D USE_ESP_IDF_LOG
board_build.partitions = min_spiffs.csv
build_unflags = -Werror=reorder
monitor_filters = esp32_exception_decoder
test_build_src = yes
check_tool = clangtidy
check_flags = clangtidy: --fix --format-style=file --config-file=.clang-tidy

[arduino]
platform = espressif32 @ ^6.9.0
framework = arduino
lib_ignore = 
	esp_websocket_client
build_flags = 
	${env.build_flags}
	-D TAG='"Arduino"'

[pioarduino]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
lib_deps = 
	${env.lib_deps}
	esp_websocket_client=https://components.espressif.com/api/downloads/?object_type=component&object_id=dbc87006-9a4b-45e6-a6ab-b286174cb413
build_flags = 
	${env.build_flags}
	-D SENSESP_SSL_SUPPORT=1

[espidf]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf, arduino
board_build.embed_txtfiles = 
	managed_components/espressif__esp_insights/server_certs/https_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
lib_deps = 
	${env.lib_deps}
	esp_websocket_client=https://components.espressif.com/api/downloads/?object_type=component&object_id=dbc87006-9a4b-45e6-a6ab-b286174cb413
build_flags = 
	${env.build_flags}
	-D SENSESP_SSL_SUPPORT=1
	-D CONFIG_LOG_DEFAULT_LEVEL_DEBUG
	-D CONFIG_LOG_MAXIMUM_LEVEL_DEBUG

[esp32]
board = esp32dev
build_flags = 
	${env.build_flags}
	-D BUTTON_BUILTIN=0
	-D LED_BUILTIN=2

[esp32c3]
board = esp32-c3-devkitm-1
build_flags = 
	${env.build_flags}
	-D SENSESP_BUTTON_PIN=9
	-D PIN_RGB_LED=8
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:arduino_esp32]
extends = 
	arduino
	esp32
build_flags = 
	${arduino.build_flags}
	${esp32.build_flags}

[env:pioarduino_esp32]
extends = 
	pioarduino
	esp32
build_flags = 
	${pioarduino.build_flags}
	${esp32.build_flags}

[env:espidf_esp32]
extends = 
	espidf
	esp32
build_flags = 
	${espidf.build_flags}
	${esp32.build_flags}
platform_packages = 

[env:arduino_esp32c3]
extends = 
	arduino
	esp32c3
build_flags = 
	${arduino.build_flags}
	${esp32c3.build_flags}

[env:pioarduino_esp32c3]
extends = 
	pioarduino
	esp32c3
build_flags = 
	${pioarduino.build_flags}
	${esp32c3.build_flags}

[env:espidf_esp32c3]
extends = 
	espidf
	esp32c3
build_flags = 
	${espidf.build_flags}
	${esp32c3.build_flags}

[env:shesp32]
extends = 
	pioarduino
	esp32
build_flags = 
	${pioarduino.build_flags}
	${esp32.build_flags}

[env:halmet]
extends = 
	pioarduino
	esp32
board_build.partitions = default_8MB.csv
build_flags = 
	${pioarduino.build_flags}
	${esp32.build_flags}

[env:halser]
extends = 
	pioarduino
	esp32c3
build_flags = 
	${pioarduino.build_flags}
	${esp32c3.build_flags}
